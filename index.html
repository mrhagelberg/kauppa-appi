<title>Bonnien ja Clyden hirmuisen upea Villin Lännen kauppa-appi!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Wild West dusk. A painted prairie scene with a tumbleweed, a wooden saloon sign for the title, a WANTED-poster verdict, and the week's list as parchment cards on a night-blue page. One committed look. */
:root {
  --night: #1a1230;
  --night-ink: #e2d3ab;
  --night-muted: #a99bc4;
  --paper: #ecdab0;
  --paper-2: #e0c994;
  --ink: #2b1a10;
  --muted: #6a4f33;
  --line: #b99a64;
  --red: #b3261e;
  --gold: #ffd45c;
  --gold-ink: #2b1d00;
  --wood: #6b4226;
  --wood-dark: #3d2414;
  --sky-top: #231650;
  --sky-low: #e8743b;
  --font-western: "Rye", "Rockwell", "Georgia", serif;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--night);
  color: var(--night-ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }

/* Scene + sign */
.mast { display: flex; flex-direction: column; gap: 12px; }
.kicker { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--font-display); font-stretch: 80%; font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--night-muted); }
.scene { display: block; width: 100%; height: auto; border-radius: 10px 10px 0 0; overflow: hidden; }
.weed { transform-box: fill-box; transform-origin: center; animation: roll 5.5s cubic-bezier(.25, .6, .3, 1) both; }
@keyframes roll { from { transform: translateX(-340px) rotate(-720deg); } to { transform: none; } }
.sign { position: relative; margin-top: -30px; background: var(--wood); background-image: repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 2px, transparent 2px 22px), repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 3px, transparent 3px 11px); border: 4px solid var(--wood-dark); border-radius: 8px; padding: 20px 18px 18px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.sign::before, .sign::after { content: ""; position: absolute; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: #2a170b; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.sign::before { left: 9px; }
.sign::after { right: 9px; }
.title { margin: 0; font-family: var(--font-western); font-weight: 400; font-size: clamp(27px, 8.2vw, 42px); line-height: 1.12; text-align: center; color: #f6e7bf; text-shadow: 0 3px 0 #2a170b; text-wrap: balance; }
.title em { font-style: normal; color: var(--gold); }
.stamp { align-self: flex-start; transform: rotate(-3deg); border: 2px solid #ff6a5e; color: #ff6a5e; padding: 5px 10px 4px; font-family: var(--font-display); font-stretch: 78%; font-weight: 800; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; border-radius: 3px; margin-top: 4px; }

.stale { background: #3a2f0c; color: #f5e2a0; padding: 10px 12px; border-radius: 6px; font-size: 13.5px; }

/* Wanted poster */
.poster { position: relative; background: var(--paper); color: var(--ink); border-radius: 4px; padding: 22px 18px 18px; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--ink), 0 6px 0 rgba(0,0,0,.4); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.poster .star { width: 34px; height: 34px; }
.poster .eyebrow { font-family: var(--font-western); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
.poster h2 { margin: 0; font-family: var(--font-western); font-weight: 400; font-size: clamp(30px, 9.6vw, 44px); line-height: 1.05; text-wrap: balance; }
.orn { width: 70%; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); height: 5px; margin-block: 4px; }
.poster .label { font-family: var(--font-display); font-stretch: 80%; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.poster .total { font-family: var(--font-display); font-weight: 900; font-size: 52px; line-height: 1; }
.poster p { margin: 4px 0 0; font-size: 14px; max-width: 40ch; }

.plussa { display: flex; align-items: center; gap: 10px; background: rgba(236, 218, 176, .1); border: 1px solid rgba(236, 218, 176, .25); border-radius: 8px; padding: 10px 12px; font-size: 14px; cursor: pointer; }
.plussa input { width: 20px; height: 20px; accent-color: var(--gold); flex: none; }
.plussa small { display: block; color: var(--night-muted); font-size: 12.5px; }

.split { background: rgba(236, 218, 176, .1); border: 1px solid rgba(236, 218, 176, .25); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.split b { font-weight: 600; color: var(--gold); }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 3px 0 rgba(0,0,0,.35); position: relative; }
.cmp.win { box-shadow: inset 0 0 0 3px var(--red), 0 3px 0 rgba(0,0,0,.35); }
.cmp .who { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.cmp .sum { font-family: var(--font-display); font-weight: 800; font-size: 25px; }
.cmp .note { font-size: 12.5px; color: var(--muted); }
.cmp .badge { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; }

h2.sec { margin: 10px 0 0; font-family: var(--font-western); font-weight: 400; font-size: 20px; letter-spacing: .04em; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.4); }

.items { display: flex; flex-direction: column; gap: 12px; }
.item { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.item.off { opacity: .6; }
.head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.head > div { min-width: 0; }
.name { font-weight: 600; font-size: 15.5px; text-wrap: balance; }
.size { color: var(--muted); font-size: 13px; }
.step { display: flex; align-items: center; gap: 2px; flex: none; }
.step button { width: 38px; height: 38px; border-radius: 5px; border: 2px solid var(--ink); background: var(--paper-2); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; font-family: var(--font-body); font-weight: 700; }
.step button:focus-visible, .tag input:focus-visible, .plussa input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.step output { min-width: 34px; text-align: center; font-weight: 700; font-size: 16px; }

.tags { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tag { border-radius: 5px; padding: 8px 10px 9px; border: 1px solid var(--line); background: var(--paper-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tag .store { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.tag .store b { color: var(--red); font-weight: 800; }
.tag .price { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.08; }
.tag .price span { font-size: 15px; font-weight: 700; margin-left: 2px; }
.tag .tnote { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.tag.best { background: var(--gold); color: var(--gold-ink); border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.tag.best .store, .tag.best .tnote { color: var(--gold-ink); }
.tag.best .store b { color: var(--red); }
.tag.na { border-style: dashed; }
.tag.na .price { font-size: 15px; font-weight: 600; font-family: var(--font-body); color: var(--muted); padding-top: 6px; }
.tag .inp { display: flex; align-items: baseline; gap: 4px; }
.tag input { width: 100%; min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: inherit; background: transparent; border: 0; border-bottom: 2px dashed var(--muted); padding: 2px 0; border-radius: 0; }
.tag input::placeholder { font-size: 14px; font-weight: 600; font-family: var(--font-body); color: var(--muted); }
.tag .inp span { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.line { font-size: 13px; color: var(--muted); }
.line b { color: var(--ink); font-weight: 700; }

.foot { font-size: 12.5px; color: var(--night-muted); display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }

@media (prefers-reduced-motion: reduce) { .weed { animation: none; } }
</style>

<div class="wrap">
  <header class="mast">
    <div class="kicker"><span id="week"></span><span id="when"></span></div>
    <div>
      <svg class="scene" viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#231650"/>
            <stop offset=".55" stop-color="#8a3a6b"/>
            <stop offset="1" stop-color="#e8743b"/>
          </linearGradient>
        </defs>
        <rect width="400" height="170" fill="url(#sky)"/>
        <circle cx="64" cy="14" r="1.4" fill="#f6e7bf"/><circle cx="120" cy="28" r="1" fill="#f6e7bf"/><circle cx="210" cy="12" r="1.3" fill="#f6e7bf"/><circle cx="290" cy="30" r="1" fill="#f6e7bf"/><circle cx="352" cy="14" r="1.4" fill="#f6e7bf"/><circle cx="20" cy="36" r="1" fill="#f6e7bf"/>
        <circle cx="290" cy="112" r="34" fill="#ffcf6b"/>
        <path d="M0 126 L34 126 L40 104 L84 104 L90 126 L150 126 L158 112 L172 112 L178 126 L250 126 L256 98 L268 92 L318 92 L326 100 L332 126 L400 126 L400 170 L0 170 Z" fill="#4a1f45"/>
        <rect y="130" width="400" height="40" fill="#2b1630"/>
        <g fill="#150b1c">
          <rect x="52" y="104" width="9" height="46" rx="4.5"/><rect x="40" y="116" width="6" height="18" rx="3"/><rect x="40" y="130" width="17" height="5" rx="2.5"/><rect x="66" y="112" width="6" height="14" rx="3"/><rect x="56" y="122" width="16" height="5" rx="2.5"/>
          <rect x="338" y="96" width="9" height="56" rx="4.5"/><rect x="326" y="110" width="6" height="20" rx="3"/><rect x="326" y="126" width="18" height="5" rx="2.5"/><rect x="352" y="104" width="6" height="16" rx="3"/><rect x="342" y="116" width="16" height="5" rx="2.5"/>
        </g>
        <g class="weed">
          <circle cx="180" cy="146" r="11" fill="none" stroke="#c98a4b" stroke-width="2"/>
          <path d="M170 146 Q180 136 190 146 M171 150 Q180 160 189 150 M180 135 Q172 146 180 157 M180 135 Q188 146 180 157" fill="none" stroke="#c98a4b" stroke-width="1.6"/>
        </g>
      </svg>
      <div class="sign"><h1 class="title">Bonnien ja Clyden <em>hirmuisen upea</em> Villin Lännen kauppa-appi!</h1></div>
    </div>
    <div class="stamp">Etsintäkuulutettu: halvin hinta</div>
  </header>
  <div id="stale" class="stale" hidden></div>
  <div id="hero"></div>
  <label class="plussa" for="plussa"><input type="checkbox" id="plussa"><span>Plussa-etuhinnat mukaan<small>Esimerkiksi Nocco 3 kpl 7 €. Vain kun kortti on mukana.</small></span></label>
  <div id="split"></div>
  <div class="compare" id="compare"></div>
  <h2 class="sec">Viikon saalislista</h2>
  <div class="items" id="items"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
// Päivitettävä data: hinnat sentteinä. null = hintaa ei tiedossa.
var FETCHED = "2026-10-19";
var STORES = [
  { id: "cm", name: "Citymarket Malmi", chain: "K-Ruoka", online: true },
  { id: "pm", name: "Prisma Malmi", chain: "S-kaupat", online: true }
];
// names: kaupan oma halvin vastaava tuote, kun tuotteen merkkiä ei ole määritelty.
var PRODUCTS = [
  { id: "ikaffe", name: "Oatly iKaffe kaurajuoma", size: "1 l", qty: 1, p: { cm: 195, pm: 194 } },
  { id: "pf-ak", name: "Valio Profeel appelsiini-kaakao proteiinipirtelö", size: "2,5 dl", qty: 4, p: { cm: 195, pm: 195 } },
  { id: "pf-pv", name: "Valio Profeel vanilja-päärynä proteiinipirtelö", size: "2,5 dl", qty: 4, p: { cm: 195, pm: 195 } },
  { id: "nocco", name: "Nocco Focus Cola", size: "0,33 l tölkki", qty: 7, p: { cm: 285, pm: 269 }, deal: { cm: { n: 3, total: 700 } } },
  { id: "riisi", name: "Gluteenittomat riisipiirakat", size: "6 kpl / 360 g, pakaste", qty: 1, p: { cm: 445, pm: 315 }, names: { cm: "Pirkka", pm: "Coop" } },
  { id: "raejuusto", name: "Valio raejuusto", size: "400 g", qty: 1, p: { cm: 285, pm: 285 } },
  { id: "olter", name: "Valio Oltermanni Monterey Jack", size: "viipale, 270 g", qty: 1, p: { cm: 399, pm: 398 } },
  { id: "maito", name: "Kevytmaito", size: "1 l", qty: 1, p: { cm: 99, pm: 95 }, names: { cm: "Pirkka suomalainen", pm: "Kotimaista" } },
  { id: "kaura", name: "Gluteenittomat kaurahiutaleet", size: "500 g", qty: 1, p: { cm: 129, pm: 91 }, names: { cm: "Pirkka iso", pm: "Kotimaista" } }
];

var nf = new Intl.NumberFormat("fi-FI", { style: "currency", currency: "EUR" });
function eur(c) { return nf.format(c / 100); }
function $(id) { return document.getElementById(id); }
function load(key, fallback) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

var qty = {};
PRODUCTS.forEach(function (p) { qty[p.id] = p.qty; });
var savedQty = load("halvin-kori-qty-v1", {});
PRODUCTS.forEach(function (p) { if (typeof savedQty[p.id] === "number") qty[p.id] = savedQty[p.id]; });
var manual = load("halvin-kori-manual-v1", {});
var plussa = load("halvin-kori-plussa-v1", false) === true;

function price(p, st) {
  var m = manual[p.id + ":" + st.id];
  if (typeof m === "number") return m;
  var v = p.p[st.id];
  return v == null ? null : v;
}
function hasManual(p, st) { return typeof manual[p.id + ":" + st.id] === "number"; }
function cost(p, st, q) {
  var pr = price(p, st);
  if (pr == null) return null;
  var d = plussa && p.deal && p.deal[st.id] && !hasManual(p, st) ? p.deal[st.id] : null;
  if (d) return Math.floor(q / d.n) * d.total + (q % d.n) * pr;
  return pr * q;
}
function dealApplies(p, st, q) {
  var d = plussa && p.deal && p.deal[st.id] && !hasManual(p, st) ? p.deal[st.id] : null;
  return !!d && q >= d.n;
}

function isoWeek(d) {
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function fiDate(iso) { var a = iso.split("-"); return Number(a[2]) + "." + Number(a[1]) + "." + a[0]; }

function compute() {
  var active = PRODUCTS.filter(function (p) { return qty[p.id] > 0; });
  var res = {};
  STORES.forEach(function (st) {
    var total = 0, missing = [];
    active.forEach(function (p) {
      var c = cost(p, st, qty[p.id]);
      if (c == null) missing.push(p); else total += c;
    });
    res[st.id] = { store: st, total: total, missing: missing };
  });
  var list = STORES.map(function (st) { return res[st.id]; });
  list.sort(function (a, b) {
    if (a.missing.length !== b.missing.length) return a.missing.length - b.missing.length;
    return a.total - b.total;
  });
  var mix = 0;
  active.forEach(function (p) {
    var vals = STORES.map(function (st) { return cost(p, st, qty[p.id]); }).filter(function (v) { return v != null; });
    if (vals.length) mix += Math.min.apply(null, vals);
  });
  return { active: active, res: res, list: list, best: list[0], mix: mix };
}

var STAR = '<svg class="star" viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,2 25,15 39,15 28,23 32,37 20,28.5 8,37 12,23 1,15 15,15" fill="#ffd45c" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="2" r="2" fill="#2b1a10"/><circle cx="39" cy="15" r="2" fill="#2b1a10"/><circle cx="32" cy="37" r="2" fill="#2b1a10"/><circle cx="8" cy="37" r="2" fill="#2b1a10"/><circle cx="1" cy="15" r="2" fill="#2b1a10"/></svg>';

function renderHero(c) {
  if (!c.active.length) {
    $("hero").innerHTML = '<div class="poster">' + STAR + '<div class="eyebrow">Ei saalista</div><h2>Lista on tyhjä</h2><p>Nosta jonkin tuotteen määrä yli nollan.</p></div>';
    return;
  }
  var b = c.best;
  var parts = [];
  if (b.missing.length) {
    parts.push("Yhdestäkään kaupasta ei löydy kaikkea.");
  } else {
    var rival = c.list.filter(function (r) { return r !== b && r.missing.length === 0; })[0];
    if (rival) {
      var diff = rival.total - b.total;
      parts.push(diff < 5 ? "Käytännössä sama hinta kuin " + rival.store.name + "." : "Edullisempi kuin " + rival.store.name + " " + eur(diff) + ".");
    }
    var out = c.list.filter(function (r) { return r.missing.length > 0; }).map(function (r) { return r.store.name; });
    if (out.length) parts.push("Ei vertailussa: " + out.join(", ") + ". Hinnat puuttuvat.");
  }
  $("hero").innerHTML =
    '<div class="poster">' + STAR +
    '<div class="eyebrow">Etsintäkuulutettu · tämän viikon kauppa</div>' +
    "<h2>" + b.store.name + "</h2>" +
    '<div class="orn"></div>' +
    '<div class="label">Koko saalis</div>' +
    '<div class="total num">' + eur(b.total) + "</div>" +
    "<p>" + c.active.length + " tuotetta" + (b.missing.length ? ", " + b.missing.length + " puuttuu" : "") + ". " + parts.join(" ") + "</p></div>";
}

function renderSplit(c) {
  var saving = c.best.total - c.mix;
  if (c.active.length && c.best.missing.length === 0 && saving >= 50) {
    $("split").innerHTML = '<div class="split">Jos kierrätte useamman kaupan ja ostatte jokaisen tuotteen halvimmasta, lista maksaa <b class="num">' + eur(c.mix) + '</b>. Säästö on <b class="num">' + eur(saving) + "</b>.</div>";
  } else {
    $("split").innerHTML = "";
  }
}

var BADGE = '<svg class="badge" viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,2 25,15 39,15 28,23 32,37 20,28.5 8,37 12,23 1,15 15,15" fill="#b3261e" stroke="#2b1a10" stroke-width="2" stroke-linejoin="round"/></svg>';

function renderCompare(c) {
  $("compare").innerHTML = STORES.map(function (st) {
    var r = c.res[st.id];
    var win = c.active.length && r === c.best;
    var note = r.missing.length ? "Puuttuu " + r.missing.length + " tuotetta" : "Kaikki löytyy";
    return '<div class="cmp' + (win ? " win" : "") + '">' + (win ? BADGE : "") + '<div class="who">' + st.name + '</div><div class="sum num">' + (r.missing.length === c.active.length && c.active.length ? "–" : eur(r.total)) + '</div><div class="note">' + note + "</div></div>";
  }).join("");
}

function renderItems() {
  $("items").innerHTML = PRODUCTS.map(function (p) {
    var q = qty[p.id];
    var qe = q > 0 ? q : 1;
    var costs = STORES.map(function (st) { return cost(p, st, qe); });
    var vals = costs.filter(function (v) { return v != null; });
    var min = vals.length ? Math.min.apply(null, vals) : null;
    var nMin = vals.filter(function (v) { return v === min; }).length;
    var bestStore = null;
    var tags = STORES.map(function (st, i) {
      var v = price(p, st);
      var isBest = costs[i] != null && costs[i] === min && vals.length > 0;
      if (isBest && !bestStore) bestStore = st;
      var label = isBest && vals.length > 1 ? "<b>" + (nMin > 1 ? "Sama" : "Halvin") + "</b>" : "";
      var head = '<div class="store"><span>' + st.name + "</span>" + label + "</div>";
      if (!st.online) {
        var mv = manual[p.id + ":" + st.id];
        var shown = typeof mv === "number" ? (mv / 100).toFixed(2).replace(".", ",") : "";
        return '<label class="tag' + (isBest ? " best" : "") + '" for="m-' + st.id + "-" + p.id + '">' + head +
          '<div class="inp"><input id="m-' + st.id + "-" + p.id + '" type="text" inputmode="decimal" autocomplete="off" placeholder="Syötä hinta" value="' + shown + '" data-p="' + p.id + '" data-s="' + st.id + '" aria-label="' + st.name + ": " + p.name + ' hinta euroina"><span>€</span></div>' +
          '<div class="tnote">Ei verkkohintaa</div></label>';
      }
      if (v == null) return '<div class="tag na">' + head + '<div class="price">Ei löytynyt</div></div>';
      var note = "";
      if (p.names && p.names[st.id]) note += '<div class="tnote">' + p.names[st.id] + "</div>";
      if (p.deal && p.deal[st.id]) {
        var d = p.deal[st.id];
        note += '<div class="tnote">' + (plussa ? "Plussa: " : "Plussa-kortilla ") + d.n + " kpl " + eur(d.total) + "</div>";
      }
      return '<div class="tag' + (isBest ? " best" : "") + '">' + head + '<div class="price num">' + eur(v).replace(/\s?€/, "") + "<span>€</span></div>" + note + "</div>";
    }).join("");
    var line;
    if (q === 0) line = "Ei mukana listalla";
    else if (min == null) line = "Ei hintaa yhdessäkään kaupassa";
    else line = q + " kpl halvimmasta (" + bestStore.name + ") <b class=\"num\">" + eur(min) + "</b>" + (dealApplies(p, bestStore, q) ? ", Plussa-hinnalla" : "");
    return '<div class="item' + (q === 0 ? " off" : "") + '">' +
      '<div class="head"><div><div class="name">' + p.name + '</div><div class="size">' + p.size + "</div></div>" +
      '<div class="step"><button type="button" data-id="' + p.id + '" data-d="-1" aria-label="Vähennä: ' + p.name + '">−</button><output class="num" aria-live="polite">' + q + '</output><button type="button" data-id="' + p.id + '" data-d="1" aria-label="Lisää: ' + p.name + '">+</button></div></div>' +
      '<div class="tags">' + tags + "</div>" +
      '<div class="line num">' + line + "</div></div>";
  }).join("");
}

function render() {
  var c = compute();
  renderHero(c);
  renderSplit(c);
  renderCompare(c);
  renderItems();
}

function init() {
  var fetched = new Date(FETCHED + "T12:00:00");
  $("week").textContent = "Viikko " + isoWeek(fetched);
  $("when").textContent = "Hinnat " + fiDate(FETCHED);
  var age = Math.floor((Date.now() - fetched.getTime()) / 864e5);
  if (age >= 3) {
    var s = $("stale");
    s.hidden = false;
    s.textContent = "Hinnat on haettu " + fiDate(FETCHED) + ", eli " + age + " päivää sitten. Automaattinen päivitys ei ole onnistunut hetkeen, joten hinnat ovat voineet muuttua.";
  }
  $("foot").innerHTML =
    "<div>Citymarket Malmin ja Prisma Malmin hinnat haetaan automaattisesti kauppojen verkkokaupoista joka aamu (viimeksi " + fiDate(FETCHED) + "). Hyllyhinta kaupassa voi poiketa.</div>" +
    "<div>Riisipiirakoissa, maidossa ja kaurahiutaleissa vertailussa on kunkin kaupan halvin vastaava tuote. Merkki näkyy hintalapussa.</div>" +
    "<div>Hinnat ovat ilman kanta-asiakaskorttia, paitsi Plussa-tarjous kun valinta on päällä. Määrät ja Plussa-valinta tallentuvat vain tälle laitteelle.</div>";
  $("plussa").checked = plussa;
  $("plussa").addEventListener("change", function (e) {
    plussa = e.target.checked;
    save("halvin-kori-plussa-v1", plussa);
    render();
  });
  $("items").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]");
    if (!b) return;
    var id = b.getAttribute("data-id");
    var d = Number(b.getAttribute("data-d"));
    qty[id] = Math.max(0, Math.min(99, (qty[id] || 0) + d));
    save("halvin-kori-qty-v1", qty);
    render();
  });
  $("items").addEventListener("change", function (e) {
    var inp = e.target;
    if (!inp.matches || !inp.matches("input[data-p]")) return;
    var key = inp.getAttribute("data-p") + ":" + inp.getAttribute("data-s");
    var n = parseFloat(String(inp.value).replace(",", ".").replace(/[^0-9.]/g, ""));
    if (isFinite(n) && n > 0 && n < 1000) manual[key] = Math.round(n * 100); else delete manual[key];
    save("halvin-kori-manual-v1", manual);
    render();
  });
  render();
}

// Hinnat luetaan prices.json-tiedostosta, jonka GitHub Actions päivittää joka aamu.
// Jos lataus epäonnistuu, käytetään yllä olevia varahintoja.
function applyPrices(d) {
  if (!d || !d.products || !d.fetched) return;
  var day = new Date(d.fetched).toLocaleDateString("sv-SE", { timeZone: "Europe/Helsinki" });
  FETCHED = day;
  PRODUCTS.forEach(function (p) {
    var row = d.products[p.id];
    if (!row) return;
    p.p = {}; p.deal = {};
    STORES.forEach(function (st) {
      var e = row[st.id];
      if (e && typeof e.cents === "number") p.p[st.id] = e.cents;
      if (e && e.deal && e.deal.n > 1 && typeof e.deal.total === "number") p.deal[st.id] = { n: e.deal.n, total: e.deal.total };
    });
  });
}
fetch("prices.json?t=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(applyPrices)
  .catch(function () {})
  .then(init);
</script>
